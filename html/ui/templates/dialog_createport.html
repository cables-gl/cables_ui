<script id="dialog_createport" type="text/x-handlebars-template">

    <h2>Edit Port</h2>

    <input id="createPortId" value="{{portId}}" class="hidden"/>

    <br/>

    <table class="formtable">
        <tr>
            <td>
                Direction
            </td>
            <td>
                <select id="createPortDir">
                    <option value="0">Input</option>
                    <option value="1" {{#if port.dir}}selected{{/if}}>Output</option>
                </select>
            </td>
        </tr>
        <tr>
            <td>
                Title
            </td>
            <td>
                <input id="createPortName" value="{{port.title}}"/>
            </td>
        </tr>
        <tr>
            <td>
                Type
            </td>
            <td>
                <select id="createPortType">
                    <option value="0">Number</option>
                    <option value="5" {{#compare port.type '==' 5}}selected{{/compare}}>String</option>
                    <option value="1" {{#compare port.type '==' 1}}selected{{/compare}}>Trigger</option>
                    <option value="2" {{#compare port.type '==' 2}}selected{{/compare}}>Object</option>
                    <option value="3" {{#compare port.type '==' 3}}selected{{/compare}}>Array</option>
                </select>
            </td>
        </tr>
        <tr id="createPortDisplayRow">
            <td>
                Display
            </td>
            <td>
                <select id="createPortDisplay"></select>
            </td>
        </tr>
        <tr id="createPortObjTypeRow" class="hidden">
            <td>
                Object type
            </td>
            <td>
                <input id="createPortObjType" value="{{port.objType}}"/>
            </td>
        </tr>
        <tr>
            <td>
                Default Value
            </td>
            <td>
                <input id="createPortValue" value="{{port.value}}"/>
            </td>
        </tr>
        <tr id="createPortValuesRow" class="hidden">
            <td>
                Switch/Dropdown options (comma seperated)
            </td>
            <td>
                <input id="createPortUiAttrValues" value="{{port.values}}"/>
            </td>
        </tr>
        <tr>
            <td colspan="3"><hr/></td>
        </tr>
        <tr>
            <td>
                Port group
            </td>
            <td>
                <input id="createPortGroup" value="{{uiAttribs.group}}"/>
            </td>
            <td class="formHelp">
                Ports with the same group are shown together under this heading in the parameter panel
            </td>
        </tr>
        <tr>
            <td>
                Hide parameter
            </td>
            <td>
                <input type="checkbox" id="createPortHideParam" {{#if uiAttribs.hideParam}}checked{{/if}}/>
            </td>
        </tr>
        <tr>
            <td>
                Hide port
            </td>
            <td>
                <input type="checkbox" id="createPortHidePort" {{#if uiAttribs.hidePort}}checked{{/if}}/>
            </td>
        </tr>
        <tr>
            <td>
                Greyed out
            </td>
            <td>
                <input type="checkbox" id="createPortGreyout" {{#if uiAttribs.greyout}}checked{{/if}}/>
            </td>
        </tr>
        <tr>
            <td>
                Additional uiattribs
            </td>
            <td>
                <input id="createPortAddUiAttribs" value="{{json otherUiAttribs}}"/>
            </td>
        </tr>
    </table>

    <br/>
    <br/>
    <a class="cblbutton bluebutton" id="createPortSubmit">Save</a>
    <a class="cblbutton"onclick="gui.closeModal();">Cancel</a>

</script>
