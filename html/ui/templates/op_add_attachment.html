<script id="op_add_attachment_string" type="text/x-handlebars-template">
    <div id="addopattachment_string" class="addopattachment">
        <div class="highlightBlock info">
            <div class="usage string">Can be accessed as string via <span class="codehint">attachments</span> in the op. <a target="_blank" href="{{docsUrl}}/docs/5_writing_ops/dev_attachments/dev_attachments">Learn more...</a></div>
        </div>
        <div class="highlightBlock error hidden"></div>
        Name:<br/>
        <input class="src" type="text">
        <input type="hidden" name="attType" value="string"/>
    </div>
</script>
<script id="op_add_attachment_js" type="text/x-handlebars-template">
    <div id="addopattachment_js" class="addopattachment">
        <div class="highlightBlock info">
            <div class="usage js">Will be executed before the op-code is run. <a target="_blank" href="{{docsUrl}}/docs/5_writing_ops/dev_attachments/dev_attachments">Learn more...</a></div>
        </div>
        <div class="highlightBlock error hidden"></div>
        Name:<br/>
        <input class="src" type="text">
        <input type="hidden" name="attType" value="js"/>
    </div>
</script>
<script id="op_add_attachment_binary" type="text/x-handlebars-template">
    <div id="addopattachment_binary" class="addopattachment">
        <div class="highlightBlock info">
            <div class="usage binary">Can be accessed as base64-string via <span class="codehint">staticAttachments</span> in the op. <a target="_blank" href="{{docsUrl}}/docs/5_writing_ops/dev_attachments/dev_attachments">Learn more...</a></div>
        </div>
        <div class="highlightBlock error hidden"></div>
        Upload attachment: <span class="uploadName"></span><br/>
        <a class="cblbutton upload">
            <span class="icon icon-plus-circle icon-1_25x"></span>Select file</a>
        <br/>
        <input type="hidden" name="attType" value="binary"/>
        <input class="hidden src" type="file" accept="{{acceptedFileTypesUpload}}"/>
    </div>
</script>
